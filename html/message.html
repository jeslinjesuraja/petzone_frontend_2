<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Message Seller | PetZone</title>
  <link rel="stylesheet" href="../css/message.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <h2>Message Seller</h2>

      <!-- MESSAGE FORM -->
      <form id="msgForm" autocomplete="off">


        <!-- TEMP PET ID (change later dynamically) -->
        <input type="hidden" id="petId" value="1">

        <div class="form-group">
          <label>Your Name</label>
          <input type="text" name="username" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea name="message" rows="4" placeholder="I'm interested in adopting this pet..." required></textarea>
        </div>

        <button type="submit">Send Message</button>

      </form>

      <a href="../html/seller.html" class="back">
        ← Back to Seller Profile
      </a>

    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script src="../java_script/message.js"> 
  </script>


</body>

</html>

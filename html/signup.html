<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Pet-Zone</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

    <div class="overlay"></div>

    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Join Pet-Zone and find your perfect companion</p>

        <form id="signupForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="e.g. John Doe" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="e.g. john@example.com" required>
            </div>

            <div class="input-group">
                <label>Location</label>
                <input type="text" id="location" placeholder="e.g. New York">
            </div>

            <div class="input-group">
                <label>Phone Number (for WhatsApp)</label>
                <input type="tel" id="phone" placeholder="e.g. +91 9876543210">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">
            </div>

            <button type="submit" id="submitBtn">Sign Up</button>
        </form>

        <div id="message" class="message"></div>

        <div class="footer">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script src="../java_script/signup.js"></script>

</body>

</html>
